kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: cluster04
  namespace: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: gitops
    server: https://kubernetes.default.svc
  project: gitops
  source:
    path: bootstrap/cluster-bootstrap
    repoURL: https://github.com/zemlab/zem-gitops
    targetRevision: main
    helm:
      valuesObject:
        cluster:
          name: cluster04
  syncPolicy:
    automated:
      prune: true
