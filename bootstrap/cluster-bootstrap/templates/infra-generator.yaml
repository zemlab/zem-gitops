{{- include "cluster-bootstrap.validate" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-generator
  namespace: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gitops
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: charts/infra-generator
    helm:
      valuesObject:
        cluster:
          name: {{ .Values.cluster.name | quote }}
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.targetRevision }}
        manualSync: {{ .Values.manualSync }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gitops
  syncPolicy:
    automated:
      prune: true
