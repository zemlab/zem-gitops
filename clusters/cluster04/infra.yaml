apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: gitops
  source:
    repoURL: https://github.com/zemlab/zem-gitops
    # Pinned during the infra ApplicationSet migration (Step 1) so this cluster
    # is isolated from changes to main until deliberately bumped. See the
    # redesigned migration plan. Revert to `main` once cluster04 is confirmed
    # stable on the new infra-features ApplicationSet (Step 7).
    targetRevision: 2eec8c004528f15630a5897137d27ae2d1406720
    path: deployments/infra
    helm:
      valuesObject:
        common:
          values:
            cluster:
              name: cluster04
        features:
          cloudflare-ingress:
            enabled: true
            values:
              externalSecret:
                remoteRefKey: infra-cloudflare-ingress-cluster04
          ingress-nginx:
            enabled: false
          project-credentials:
            enabled: true
            values:
              namespaces: []
          registry-auth:
            enabled: true
            extraDestinationNamespaces:
              - zenith-staging
              - zenith-prod
              - gitlab-prod
              - zem-internal-prod
            values:
              namespaces:
                - zenith-staging
                - zenith-prod
                - gitlab-prod
                - zem-internal-prod
              ocirNamespaces:
                - zenith-staging
                - zenith-prod
                - gitlab-prod
                - zem-internal-prod
          cnpg:
            enabled: true
          longhorn:
            enabled: true
            values:
              ingress:
                hostname: longhorn-cluster04
              backup:
                b2AccessKeyIdSecret: "longhorn-backup-cluster04-access-key-id"
                b2SecretAccessKeySecret: "longhorn-backup-cluster04-secret-access-key"
              longhorn:
                defaultBackupStore:
                  backupTarget: "s3://zem-backups-eu@eu-central-003/longhorn-cluster04"
                persistence:
                  recurringJobSelector:
                    jobList: '[{"name":"snapshot-2h","isGroup":false},{"name":"backup-daily","isGroup":false}]'
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gitops
  # No automated sync policy (Step 2 of the infra ApplicationSet migration):
  # the old app-of-apps must not fight the new infra-features ApplicationSet
  # while it adopts these same feature Applications. Re-add once this whole
  # Application is removed at the end of the migration -- it never should be,
  # since removal (Step 6) happens before that would matter.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/syncPolicy
